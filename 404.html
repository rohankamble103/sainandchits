<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | {{shortName}}</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf { padding: 90px 0 110px; text-align: center; }
    .nf .code { font-family: 'Merriweather', serif; font-size: clamp(80px, 14vw, 150px); font-weight: 900; line-height: 1; background: linear-gradient(180deg, #d63a3e, #8a1215); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { font-family: 'Merriweather', serif; font-size: clamp(24px, 3vw, 32px); margin: 14px 0 10px; }
    .nf p { color: var(--ink-soft); max-width: 480px; margin: 0 auto; line-height: 1.6; }
    .nf .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    .nf .links { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; font-weight: 600; }
    .nf .links a { color: var(--red-deep); }
  </style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#9e1418">
</head>
<body>
  <!--@topbar-->
  <!--@header page=""-->
  <main class="nf">
    <div class="wrap">
      <div class="code">404</div>
      <h1>Sorry, this page isn’t here</h1>
      <p>The page you’re looking for may have moved or the address may be mistyped. Let’s get you back on track.</p>
      <div class="acts"><a href="/" class="btn-fill">Go to home page</a><a href="/#plans" class="btn-light">View plans</a></div>
      <div class="links"><a href="/#scheme">How it works</a><a href="/news">News</a><a href="/careers">Careers</a><a href="/contact-us">Contact us</a><a href="/faq">FAQ</a></div>
    </div>
  </main>
  <!--@footer-->
  <!--@siteConfig-->
  <script src="/js/script.js" defer></script>
</body>
</html>
