# nginx site for Sainand Chits India
#   sudo cp deploy/nginx-sainand.conf /etc/nginx/sites-available/sainand
#   sudo ln -s /etc/nginx/sites-available/sainand /etc/nginx/sites-enabled/sainand
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sainandchits.com -d www.sainandchits.com
# Certbot adds the HTTPS (443) block and the certificate lines automatically.

limit_req_zone $binary_remote_addr zone=sainand_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sainandchits.com www.sainandchits.com;

    # Always use the address without "www".
    if ($host = www.sainandchits.com) {
        return 301 https://sainandchits.com$request_uri;
    }

    client_max_body_size 12m;      # CV and certificate uploads
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hidden and private files are never served, even if one ends up in the folder.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|sql|sh|bak|log|md)$ { deny all; }

    location /api/ {
        limit_req zone=sainand_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/sainand-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/sainand-proxy.conf;
    }
}
